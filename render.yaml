# Render Blueprint: API-only backend. The React UI is deployed separately on Vercel
# (frontend/), which talks to this service via VITE_API_BASE.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo, then fill in the API keys.
services:
  - type: web
    name: creative-research-worker
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APIFY_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_TIKTOK
        value: "false"
      # Vercel frontend origin(s), comma-separated - required for CORS
      - key: FRONTEND_URL
        sync: false
