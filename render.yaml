services:
  - type: web
    name: creative-research-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: APP_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://creative-research.vercel.app
      - key: APIFY_TOKEN
        sync: false
